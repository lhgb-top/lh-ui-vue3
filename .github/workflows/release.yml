name: Release

# 推送到 main 且 changeset 或版本号有变动时自动执行 version + publish；
# 没有待发布的 changeset 时 changesets/action 什么都不做，所以挂在 push 上是安全的。
# 也可在仓库 Actions 页面手动触发。
on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Verify declaration files
        run: pnpm verify:dts

      - name: Version and publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: 'chore(release): 更新版本号'
          title: 'chore(release): 版本发布'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
