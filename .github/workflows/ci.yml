name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest

    # dts 构建每个入口起一个 TS program（rollup.dts.config.js 注释记录过默认堆 OOM），
    # docs:build / coverage 同为吃内存大户，CI runner 上统一放宽堆上限
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 30（vitest 环境）要求 Node ^22.22.2；undici 8 的 webidl 需要
          # node:worker_threads 的 markAsUncloneable（Node 22+），Node 20 下加载即炸
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Component tests
        run: pnpm test:components

      - name: Coverage
        run: pnpm test:coverage

      - name: Build docs
        run: pnpm docs:build

      - name: Build library
        run: pnpm build

      - name: Verify declaration files
        run: node scripts/verify-dts.mjs
